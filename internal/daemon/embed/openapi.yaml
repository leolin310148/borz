openapi: 3.1.0
info:
  title: borz daemon API
  version: "1.0.0"
  description: |
    HTTP/REST front-end for the borz daemon. Each `/v1/*` endpoint accepts
    a JSON body, dispatches a request to the attached Chrome (CDP) session, and
    returns a `Response` envelope.

    - Default address: `http://127.0.0.1:19824`.
    - Authentication: if the daemon was started with a token, every request
      (except `/healthz`) must carry `Authorization: Bearer <token>`.
    - Tab targeting: most endpoints accept `tab` (short ID string) or the
      deprecated `tabId` alias (string or number) in the body. Omit to target
      the active tab.
servers:
  - url: http://127.0.0.1:19824
    description: Local daemon (default)
security:
  - bearerAuth: []
tags:
  - name: health
  - name: status
  - name: navigation
  - name: interaction
  - name: input
  - name: observation
  - name: webauthn
  - name: tabs
  - name: extension
  - name: sites
  - name: diagnostics
  - name: raw

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe (unauthenticated)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  cdpConnected: { type: boolean }
                  uptime: { type: integer, description: seconds since daemon start }

  /status:
    get:
      tags: [status]
      summary: Daemon and tab state
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DaemonStatus" }

  /shutdown:
    post:
      tags: [status]
      summary: Shut the daemon down
      responses:
        "200":
          description: Shutdown scheduled
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  message: { type: string }

  /v1/open:
    post:
      tags: [navigation]
      summary: Open a URL (reuses a matching tab unless `new` is true)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TabTarget"
                - $ref: "#/components/schemas/WaitOptions"
                - $ref: "#/components/schemas/ViewportBody"
                - type: object
                  required: [url]
                  properties:
                    url: { type: string, format: uri }
                    new: { type: boolean, default: false }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }

  /v1/back:
    post:
      tags: [navigation]
      summary: Navigate back
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TabTarget"
                - $ref: "#/components/schemas/WaitOptions"
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /v1/forward:
    post:
      tags: [navigation]
      summary: Navigate forward
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TabTarget"
                - $ref: "#/components/schemas/WaitOptions"
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /v1/refresh:
    post:
      tags: [navigation]
      summary: Refresh the page
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TabTarget"
                - $ref: "#/components/schemas/WaitOptions"
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /v1/close:
    post:
      tags: [navigation]
      summary: Close the targeted tab
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/TabTarget" } } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /v1/click:
    post:
      tags: [interaction]
      summary: Click an element by snapshot ref
      requestBody: { $ref: "#/components/requestBodies/RefOnly" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /v1/hover:
    post:
      tags: [interaction]
      summary: Hover an element by snapshot ref
      requestBody: { $ref: "#/components/requestBodies/RefOnly" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /v1/check:
    post:
      tags: [interaction]
      summary: Check a checkbox/radio by ref
      requestBody: { $ref: "#/components/requestBodies/RefOnly" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /v1/uncheck:
    post:
      tags: [interaction]
      summary: Uncheck a checkbox by ref
      requestBody: { $ref: "#/components/requestBodies/RefOnly" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /v1/fill:
    post:
      tags: [interaction]
      summary: Fill an input by ref (replaces value)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TabTarget"
                - $ref: "#/components/schemas/WaitOptions"
                - type: object
                  required: [ref, text]
                  properties:
                    ref: { type: string }
                    text: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /v1/type:
    post:
      tags: [interaction]
      summary: Type text into an input by ref (appends)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TabTarget"
                - $ref: "#/components/schemas/WaitOptions"
                - type: object
                  required: [ref, text]
                  properties:
                    ref: { type: string }
                    text: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /v1/select:
    post:
      tags: [interaction]
      summary: Select an option in a native select or visible ARIA combobox by ref
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TabTarget"
                - $ref: "#/components/schemas/WaitOptions"
                - type: object
                  required: [ref, value]
                  properties:
                    ref: { type: string, description: Snapshot ref for the select or combobox }
                    value: { type: string, description: Native option value or custom-combobox value/aria-label/exact visible text }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /v1/upload:
    post:
      tags: [interaction]
      summary: Attach files to an `<input type=file>` or its label by ref
      description: |
        The ref may point directly at the file input or at an associated label;
        borz resolves `label.control` or a nested file input automatically.
        Wraps CDP `DOM.setFileInputFiles`. Paths are resolved on the daemon's
        filesystem (where Chrome runs) — remote clients must reference files
        that exist on the daemon host, not on the client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TabTarget"
                - $ref: "#/components/schemas/WaitOptions"
                - type: object
                  required: [ref]
                  properties:
                    ref: { type: string }
                    files:
                      type: array
                      items: { type: string }
                      description: Absolute file paths on the daemon host.
                    file:
                      type: string
                      description: Single-file convenience alias for `files`.
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /v1/dialog:
    post:
      tags: [interaction]
      summary: Handle or pre-arm native alert/confirm/prompt/beforeunload dialogs
      description: |
        Wraps CDP `Page.javascriptDialogOpening` + `Page.handleJavaScriptDialog`.

        `command=accept` / `dismiss` resolves the dialog that is already open on
        the tab; when no dialog is open it arms the next one instead (one-shot).
        Arming BEFORE the click that triggers the dialog is still the reliable
        pattern — a dialog left open blocks the renderer, so every other command
        against that tab fails fast with a dialog-blocked error until it is
        resolved.

        `command=status` never changes state: it reports the armed handler, the
        currently open dialog (`pending`, with `blocked: true` when nothing has
        answered it), and recent dialog history under `dialogInfo`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TabTarget"
                - type: object
                  properties:
                    command:
                      type: string
                      enum: [accept, dismiss, disarm, status]
                      default: accept
                    promptText:
                      type: string
                      description: >
                        Response submitted for a prompt() dialog; ignored for
                        alert/confirm. `text` is accepted as an alias.
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /v1/filechooser:
    post:
      tags: [interaction]
      summary: Pre-arm a handler for the next native file-picker dialog
      description: |
        Wraps CDP `Page.setInterceptFileChooserDialog` + `Page.fileChooserOpened`.
        Arm with `command=accept` BEFORE clicking the element that opens the
        picker; the native dialog is suppressed and the chooser is fulfilled
        with `files` via `DOM.setFileInputFiles`. Use for sites that create
        the file input dynamically or open the OS dialog directly (no
        `<input type=file>` in the DOM to target with /v1/upload). Arming is
        one-shot. Paths are resolved on the daemon's filesystem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TabTarget"
                - type: object
                  properties:
                    command:
                      type: string
                      enum: [accept, cancel, disarm, status]
                      default: status
                    files:
                      type: array
                      items: { type: string }
                      description: Absolute file paths on the daemon host (required for accept).
                    file:
                      type: string
                      description: Single-file convenience alias for `files`.
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /v1/page/visibility:
    post:
      tags: [interaction]
      summary: Override what the page believes about its own visibility
      description: |
        Makes `document.visibilityState` / `document.hidden` report the given
        state and fires a synthetic `visibilitychange` event, so pages that
        gate work on visibility (uploads, polling, timers) run while the
        browser window is backgrounded or minimized. Also emulates focus and
        sets the web lifecycle state to active (best-effort). The override
        persists across navigations in the tab until `reset`. Note: this
        cannot un-throttle requestAnimationFrame / compositor rendering — use
        /v1/tabs/front to really unhide the window when that matters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TabTarget"
                - type: object
                  properties:
                    visibility:
                      type: string
                      enum: [visible, hidden, reset]
                      description: Omit to report status only.
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /v1/webauthn:
    post:
      tags: [webauthn]
      summary: Control a tab-scoped Chrome WebAuthn virtual authenticator
      description: |
        Typed access to Chrome's CDP WebAuthn domain; this is not a raw CDP
        passthrough. Use the lifecycle `enable` → `add` → registration/login
        ceremonies → `credentials` → `remove` → `disable`. `add` defaults to
        a Passkey-ready CTAP2/internal authenticator with resident keys, user
        verification, verified-user state, and automatic presence enabled.
        `authenticatorId` returned by `add` is required for the credential,
        control, and remove commands. State is scoped to the selected tab's
        CDP target session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TabTarget"
                - type: object
                  required: [command]
                  properties:
                    command:
                      type: string
                      enum: [enable, disable, add, credentials, remove, set-user-verified, set-automatic-presence]
                    authenticatorId:
                      type: string
                      description: Required except for enable, disable, and add.
                    protocol:
                      type: string
                      enum: [ctap2, u2f]
                      default: ctap2
                      description: Used by add.
                    transport:
                      type: string
                      enum: [internal, usb, nfc, ble]
                      default: internal
                      description: Used by add.
                    hasResidentKey:
                      type: boolean
                      default: true
                      description: Used by add.
                    hasUserVerification:
                      type: boolean
                      default: true
                      description: Used by add.
                    isUserVerified:
                      type: boolean
                      default: true
                      description: Used by add and required by set-user-verified.
                    automaticPresence:
                      type: boolean
                      default: true
                      description: Used by add and required by set-automatic-presence.
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }

  /v1/press:
    post:
      tags: [input]
      summary: Dispatch a keyboard key (with optional modifiers)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TabTarget"
                - $ref: "#/components/schemas/WaitOptions"
                - type: object
                  required: [key]
                  properties:
                    key:
                      type: string
                      description: CDP key name (e.g. `Enter`, `Tab`, `Escape`, `a`)
                    modifiers:
                      type: array
                      items:
                        type: string
                        enum: [alt, ctrl, meta, shift]
                    commands:
                      type: array
                      items: { type: string }
                      description: |
                        CDP editing commands sent with the keyDown event
                        (e.g. `selectAll`, `copy`, `paste`). Synthesized key
                        events never reach the browser-process shortcut layer
                        (macOS handles Cmd+A/C/X/V there), so editing combos
                        need this. Well-known `meta` combos are auto-mapped
                        when omitted.
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /v1/key:
    post:
      tags: [input]
      summary: Low-level key input (down/up/press/type)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TabTarget"
                - type: object
                  properties:
                    keyType:
                      type: string
                      enum: [press, down, up, type]
                      default: press
                      description: |
                        - `press`: keyDown + optional char + keyUp (default)
                        - `down` / `up`: only one half of a key event
                        - `type`: dispatches a `char` event per rune in `text`
                          (reaches canvas apps / SSH sessions)
                    key: { type: string }
                    code: { type: string }
                    text: { type: string }
                    modifiers:
                      type: array
                      items: { type: string, enum: [alt, ctrl, meta, shift] }
                    commands:
                      type: array
                      items: { type: string }
                      description: Editing commands sent with keyDown (e.g. `selectAll`).
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /v1/mouse:
    post:
      tags: [input]
      summary: Low-level mouse input (move/down/up/click/wheel)
      description: Coordinates use viewport CSS pixels. For a canvas pointer drag, send down at the source, move with button left, then up at the target on the same tab. No HTML5 DataTransfer is synthesized.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TabTarget"
                - type: object
                  required: [mouseType]
                  properties:
                    waitFor: { type: string, description: CSS selector to wait for after input }
                    timeoutMs: { type: integer, minimum: 0 }
                    mouseType:
                      type: string
                      enum: [move, down, up, click, wheel]
                    x: { type: number }
                    y: { type: number }
                    button:
                      type: string
                      enum: [left, right, middle, none]
                      default: left
                    deltaX: { type: number }
                    deltaY: { type: number }
                    clickCount: { type: integer }
                    modifiers:
                      type: array
                      items: { type: string, enum: [alt, ctrl, meta, shift] }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /v1/clipboard-read:
    post:
      tags: [input]
      summary: Read the clipboard contents from the browser
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/TabTarget" } } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /v1/clipboard-write:
    post:
      tags: [input]
      summary: Write text to the clipboard, optionally pasting it into the focused terminal
      description: |
        Sets the tab's clipboard to `text` via `navigator.clipboard.writeText`
        (the tab is brought to the foreground first, which clipboard writes
        require). When `paste` is true the daemon then fires Ctrl+Shift+V so the
        browser performs a native paste into the focused element — the atomic
        "set clipboard → paste once" path for driving an xterm.js / SSH terminal
        without per-character key streaming or Enter races. For the paste to
        land the terminal must have focus; the daemon best-effort focuses the
        xterm textarea (including inside same-origin iframes) first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TabTarget"
                - type: object
                  required: [text]
                  properties:
                    text:
                      type: string
                      description: Text to place on the clipboard (e.g. a base64-encoded script). An explicit empty string clears it; omitted or null text is rejected.
                    paste:
                      type: boolean
                      default: false
                      description: After writing, fire Ctrl+Shift+V to paste into the focused terminal.
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /v1/term-text:
    post:
      tags: [observation]
      summary: Read an xterm.js terminal buffer as plain text (incl. scrollback)
      description: |
        Returns the text contents of an xterm.js terminal — including
        scrollback — as a replacement for screenshot/OCR of canvas-rendered
        terminals (e.g. JumpServer Luna SSH). The daemon walks the page and
        every same-origin iframe (via `contentDocument`) looking for a live
        `Terminal` instance and reads `buffer.active` line by line.

        The flat text is returned in `data.value`; `data.result` carries
        metadata `{ found, source, text, lines, cols, rows, note }`. `source`
        is one of:
          - `xterm-buffer`: full buffer incl. scrollback (best case)
          - `xterm-accessibility`: screen-reader layer (visible region only)
          - `xterm-rows`: DOM-renderer rows (visible viewport, no scrollback)
          - `none`: no terminal reachable (canvas/WebGL with no reachable
            instance, or a cross-origin iframe) — still a 200 with a `note`
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/TabTarget" } } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /v1/scroll:
    post:
      tags: [interaction]
      summary: Scroll the page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TabTarget"
                - $ref: "#/components/schemas/WaitOptions"
                - type: object
                  required: [direction]
                  properties:
                    direction:
                      type: string
                      enum: [up, down, left, right, top, bottom]
                    pixels:
                      type: integer
                      description: Distance in pixels; ignored for top/bottom.
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /v1/eval:
    post:
      tags: [interaction]
      summary: Evaluate JavaScript in the page context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TabTarget"
                - $ref: "#/components/schemas/WaitOptions"
                - type: object
                  required: [script]
                  properties:
                    script:
                      type: string
                      description: |
                        JS expression. The REST endpoint does not auto-wrap top-level
                        `await` (the CLI does); pass an async IIFE that returns a
                        Promise instead:
                        `(async () => { return fetch('/x').then(r => r.text()) })()`.
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /v1/wait:
    post:
      tags: [interaction]
      summary: Sleep for `ms` milliseconds
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TabTarget"
                - type: object
                  properties:
                    ms: { type: integer, minimum: 0 }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /v1/viewport:
    post:
      tags: [observation]
      summary: Inspect or emulate the tab viewport
      description: |
        Omit viewport fields to read the current tab viewport. Pass `preset:
        mobile` for responsive/mobile testing, or custom `width`/`height`/`dpr`
        fields. `reset: true` clears CDP viewport and touch emulation.
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TabTarget"
                - $ref: "#/components/schemas/ViewportBody"
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /v1/snapshot:
    post:
      tags: [observation]
      summary: Accessibility-tree snapshot with element refs
      description: |
        Returns a YAML-ish snapshot plus a `refs`/`elements` map you can feed
        back into `/v1/click`, `/v1/fill`, etc. Use `interactive: true` to skip
        non-interactive nodes, or `selector` / `role` to filter.

        Ref visibility follows `snapshot.showRefs` in the daemon host's
        `~/.borz/settings.json` (visible when omitted). Pass `showRefs` to
        override that setting for this request. Hidden refs remain actionable.

        Pass `diff: true` to also receive a `snapshotDiffData` object that
        lists only what was added, removed, or whose tracked attributes
        (aria-pressed, aria-disabled, etc.) or accessible name changed since
        the previous snapshot of the same tab. The first call after
        navigation (or the first ever) is a baseline reset:
        `baselineReset` is true and everything is reported as added.
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TabTarget"
                - type: object
                  properties:
                    interactive: { type: boolean }
                    compact: { type: boolean }
                    maxDepth: { type: integer }
                    selector: { type: string, description: CSS selector subtree root }
                    role: { type: string, description: ARIA role filter }
                    showRefs:
                      type: boolean
                      description: Override settings.json ref visibility for this request. Refs are returned either way.
                    diff:
                      type: boolean
                      description: |
                        When true, include a `snapshotDiffData` object alongside the
                        regular snapshot, listing only changes since the previous
                        snapshot of this tab. Not compatible with `mode: text`.
                    mode:
                      type: string
                      enum: [text]
                      description: |
                        Output format. Default is the accessibility tree with refs.
                        `"text"` returns a reader-mode plain-text dump (title +
                        URL + visible text, with nav/header/footer/script/style
                        stripped). No refs are produced in text mode.
      responses:
        "200":
          description: Snapshot response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          snapshotData: { $ref: "#/components/schemas/SnapshotData" }
                          snapshotDiffData: { $ref: "#/components/schemas/SnapshotDiffData" }

  /v1/refs/clear:
    post:
      tags: [observation]
      summary: Remove snapshot ref overlays without invalidating refs
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/TabTarget" } } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /v1/screenshot:
    post:
      tags: [observation]
      summary: Capture a PNG screenshot
      description: |
        Snapshot ref highlights are temporarily hidden while the image is captured.
        Optional annotations frame refs from the latest snapshot and render
        plain-text callouts; annotated elements must be visible in the viewport.
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TabTarget"
                - type: object
                  properties:
                    path:
                      type: string
                      description: |
                        If set, writes the PNG to this filesystem path on the
                        daemon host. Omit to get a `data:` URL back.
                    annotations:
                      type: array
                      maxItems: 20
                      description: Temporary element frames and callouts rendered only for this capture.
                      items:
                        type: object
                        required: [ref, text]
                        properties:
                          ref:
                            type: string
                            description: Current element ref from /v1/snapshot, with optional @ prefix.
                          text:
                            type: string
                            minLength: 1
                            description: Plain-text callout shown beside the framed element.
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /v1/get:
    post:
      tags: [observation]
      summary: Read a page or element attribute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TabTarget"
                - type: object
                  required: [attribute]
                  properties:
                    attribute:
                      type: string
                      description: e.g. `title`, `url`, `textContent`, `value`, `outerHTML`
                    ref:
                      type: string
                      description: Element ref from a snapshot (omit for page-level attributes).
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /v1/network:
    post:
      tags: [observation]
      summary: Inspect captured network requests
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TabTarget"
                - type: object
                  properties:
                    command:
                      type: string
                      enum: [requests, clear]
                      default: requests
                    filter: { type: string, description: URL substring filter }
                    method: { type: string }
                    status: { type: string, description: Status code or class (e.g. `200`, `4xx`) }
                    withBody: { type: boolean }
                    since: { $ref: "#/components/schemas/Since" }
                    limit: { type: integer, minimum: 1, description: Return at most this many newest matching requests }
      responses:
        "200":
          description: Captured requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          networkRequests:
                            type: array
                            items: { $ref: "#/components/schemas/NetworkRequestInfo" }

  /v1/console:
    post:
      tags: [observation]
      summary: Inspect captured console messages
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TabTarget"
                - type: object
                  properties:
                    command:
                      type: string
                      enum: [get, clear]
                      default: get
                    filter: { type: string }
                    since: { $ref: "#/components/schemas/Since" }
                    limit: { type: integer, minimum: 1, description: Return at most this many newest matching messages }
      responses:
        "200":
          description: Console messages
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          consoleMessages:
                            type: array
                            items: { $ref: "#/components/schemas/ConsoleMessageInfo" }

  /v1/errors:
    post:
      tags: [observation]
      summary: Inspect captured JavaScript errors
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TabTarget"
                - type: object
                  properties:
                    command:
                      type: string
                      enum: [get, clear]
                      default: get
                    filter: { type: string }
                    since: { $ref: "#/components/schemas/Since" }
                    limit: { type: integer, minimum: 1, description: Return at most this many newest matching errors }
      responses:
        "200":
          description: JS errors
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          jsErrors:
                            type: array
                            items: { $ref: "#/components/schemas/JSErrorInfo" }

  /v1/doctor:
    get:
      tags: [diagnostics]
      summary: Daemon-side health summary (CDP attach + tab presence)
      description: |
        Quick stack diagnostic from inside the daemon. Returns 200 with
        `{ok: true, checks: [...]}` when all checks pass, 503 when any check
        fails. Use this as the remote analogue of the CLI `borz doctor`.
      responses:
        "200":
          description: All checks passed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DoctorReport" }
        "503":
          description: One or more checks failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DoctorReport" }
    post:
      tags: [diagnostics]
      summary: Same as GET — POST is accepted for clients that prefer it
      responses:
        "200":
          description: All checks passed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DoctorReport" }
        "503":
          description: One or more checks failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DoctorReport" }

  /v1/tabs:
    get:
      tags: [tabs]
      summary: List open tabs
      responses:
        "200":
          description: Tab list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          tabs:
                            type: array
                            items: { $ref: "#/components/schemas/TabInfo" }
                          activeIndex: { type: integer }
    post:
      tags: [tabs]
      summary: Open a new tab
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ViewportBody"
                - type: object
                  properties:
                    url:
                      type: string
                      format: uri
                      description: Defaults to `about:blank` when omitted.
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /v1/tabs/select:
    post:
      tags: [tabs]
      summary: Activate a tab by `tabId` or `index`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tabId: { $ref: "#/components/schemas/TabID" }
                index: { type: integer }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /v1/tabs/close:
    post:
      tags: [tabs]
      summary: Close a tab by `tabId` or `index`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tabId: { $ref: "#/components/schemas/TabID" }
                index: { type: integer }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /v1/tabs/front:
    post:
      tags: [tabs]
      summary: Bring a tab to the real OS foreground
      description: |
        Restores the Chrome window if minimized (`Browser.setWindowBounds`),
        activates the tab (`Target.activateTarget`) and focuses the page
        (`Page.bringToFront`). Unlike /v1/tabs/select this targets the OS
        window level, so `document.visibilityState` becomes `visible` and
        background throttling stops. The response result reports the window
        state and the page's resulting visibilityState.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TabTarget"
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /v1/fetch:
    post:
      tags: [observation]
      summary: HTTP request through the page's session (cookies, CORS, etc.)
      description: |
        Runs `fetch(url, { credentials: 'include' })` inside the targeted tab
        and returns status, headers, and decoded body. Useful for hitting
        authenticated endpoints without re-implementing the session handshake.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TabTarget"
                - type: object
                  required: [url]
                  properties:
                    url: { type: string, format: uri }
                    method: { type: string, default: GET }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /v1/sites:
    get:
      tags: [sites]
      summary: List installed site adapters
      responses:
        "200":
          description: Adapter list
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      sites:
                        type: array
                        items: { $ref: "#/components/schemas/SiteMeta" }

  /v1/sites/info:
    post:
      tags: [sites]
      summary: Describe a single adapter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200":
          description: Adapter metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      site: { $ref: "#/components/schemas/SiteMeta" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/sites/run:
    post:
      tags: [sites]
      summary: Execute a site adapter against the targeted tab
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TabTarget"
                - type: object
                  required: [name]
                  properties:
                    name: { type: string }
                    args:
                      type: object
                      additionalProperties: true
                      description: |
                        Adapter-specific arguments, matching keys declared in
                        the adapter's `@meta.args` block.
                    force:
                      type: boolean
                      description: Bypass community trust checks and domain guard for this run.
                    timeoutMs:
                      type: integer
                      description: Maximum adapter JavaScript execution time in milliseconds.
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/ext/capabilities:
    get:
      tags: [extension]
      summary: Connected Chrome extension capabilities
      responses:
        "200":
          description: Extension status and supported RPC methods
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile: { type: string, description: Daemon profile this extension bridge belongs to }
                additionalProperties: true
        "503": { $ref: "#/components/responses/Error" }

  /v1/ext/call:
    post:
      tags: [extension]
      summary: Raw Chrome extension RPC call
      description: Advanced escape hatch for supported extension methods such as `bookmarks.search`, `history.search`, `downloads.search`, `windows.getAll`, and `tabs.query`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: { type: string }
                params: { type: object, additionalProperties: true }
      responses:
        "200": { description: Raw extension method result }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /v1/cookies/all:
    get:
      tags: [extension]
      summary: All Chrome cookies visible to the extension
      parameters:
        - { name: domain, in: query, schema: { type: string } }
        - { name: name, in: query, schema: { type: string } }
        - { name: url, in: query, schema: { type: string } }
      responses:
        "200": { description: Cookie array }
        "503": { $ref: "#/components/responses/Error" }

  /v1/cookies/set:
    post:
      tags: [extension]
      summary: Set a Chrome cookie through chrome.cookies
      requestBody: { $ref: "#/components/requestBodies/FreeformJSON" }
      responses: { "200": { description: Cookie result }, "503": { $ref: "#/components/responses/Error" } }

  /v1/cookies/remove:
    post:
      tags: [extension]
      summary: Remove a Chrome cookie through chrome.cookies
      requestBody: { $ref: "#/components/requestBodies/FreeformJSON" }
      responses: { "200": { description: Removal result }, "503": { $ref: "#/components/responses/Error" } }

  /v1/bookmarks/tree:
    get:
      tags: [extension]
      summary: Chrome bookmark tree
      responses:
        "200": { description: Bookmark tree }
        "503": { $ref: "#/components/responses/Error" }

  /v1/bookmarks/search:
    get:
      tags: [extension]
      summary: Search Chrome bookmarks
      parameters:
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200": { description: Bookmark search results }
        "503": { $ref: "#/components/responses/Error" }

  /v1/bookmarks/create:
    post:
      tags: [extension]
      summary: Create a Chrome bookmark
      requestBody: { $ref: "#/components/requestBodies/FreeformJSON" }
      responses: { "200": { description: Created bookmark }, "503": { $ref: "#/components/responses/Error" } }

  /v1/bookmarks/update:
    post:
      tags: [extension]
      summary: Update a Chrome bookmark
      requestBody: { $ref: "#/components/requestBodies/FreeformJSON" }
      responses: { "200": { description: Updated bookmark }, "503": { $ref: "#/components/responses/Error" } }

  /v1/bookmarks/remove:
    post:
      tags: [extension]
      summary: Remove a Chrome bookmark or folder
      requestBody: { $ref: "#/components/requestBodies/FreeformJSON" }
      responses: { "200": { description: Removal result }, "503": { $ref: "#/components/responses/Error" } }

  /v1/browser-history/search:
    get:
      tags: [extension]
      summary: Search Chrome browsing history
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: maxResults, in: query, schema: { type: integer } }
      responses:
        "200": { description: History items }
        "503": { $ref: "#/components/responses/Error" }

  /v1/browser-history/delete-url:
    post:
      tags: [extension]
      summary: Delete one URL from Chrome browsing history
      requestBody: { $ref: "#/components/requestBodies/FreeformJSON" }
      responses: { "200": { description: Delete result }, "503": { $ref: "#/components/responses/Error" } }

  /v1/browser-history/delete-range:
    post:
      tags: [extension]
      summary: Delete a time range from Chrome browsing history
