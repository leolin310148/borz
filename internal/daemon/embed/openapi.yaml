  /v1/ext/tabs/capture-visible:
    post:
      tags: [extension]
      summary: Capture the visible Chrome tab via chrome.tabs.captureVisibleTab
      requestBody: { $ref: "#/components/requestBodies/FreeformJSON" }
      responses: { "200": { description: Data URL }, "503": { $ref: "#/components/responses/Error" } }

  /v1/ext/tabs/duplicate:
    post:
      tags: [extension]
      summary: Duplicate a Chrome tab through the extension
      requestBody: { $ref: "#/components/requestBodies/FreeformJSON" }
      responses: { "200": { description: Duplicated tab }, "503": { $ref: "#/components/responses/Error" } }

  /v1/ext/tabs/discard:
    post:
      tags: [extension]
      summary: Discard a Chrome tab through the extension
      requestBody: { $ref: "#/components/requestBodies/FreeformJSON" }
      responses: { "200": { description: Discarded tab }, "503": { $ref: "#/components/responses/Error" } }

  /v1/ext/tabs/reload:
    post:
      tags: [extension]
      summary: Reload a Chrome tab through the extension
      requestBody: { $ref: "#/components/requestBodies/FreeformJSON" }
      responses: { "200": { description: Reload result }, "503": { $ref: "#/components/responses/Error" } }

  /v1/ext/tab-groups/query:
    get:
      tags: [extension]
      summary: Query Chrome tab groups through the extension
      responses:
        "200": { description: Tab group results }
        "503": { $ref: "#/components/responses/Error" }

  /command:
    post:
      tags: [raw]
      summary: Raw protocol escape hatch
      description: |
        Accepts a full `protocol.Request` JSON body and dispatches it. Use only
        when no `/v1/*` route fits — most clients should prefer the typed
        endpoints above.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Request" }
      responses:
        "200":
          description: Raw response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Response" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Required when the daemon was started with a token.

  requestBodies:
    FreeformJSON:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true

    RefOnly:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/TabTarget"
              - $ref: "#/components/schemas/WaitOptions"
              - type: object
                required: [ref]
                properties:
                  ref: { type: string, description: Element ref from a prior snapshot }

  responses:
    Ok:
      description: Successful response envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Response" }
    Error:
      description: Error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Response" }

  schemas:
    TabID:
      description: Tab identifier — either a string (short ID / target ID) or an integer index.
      oneOf:
        - type: string
        - type: integer

    TabTarget:
      type: object
      description: Common tab-targeting fields accepted by most endpoints.
      properties:
        tabId:
          allOf:
            - $ref: "#/components/schemas/TabID"
          deprecated: true
          description: Deprecated alias; prefer `tab`.
        tab:
          type: string
          description: Preferred short tab ID string.
        activate:
          type: boolean
          description: Bring the resolved tab to the foreground before running the action.

    WaitOptions:
      type: object
      description: |
        After-action wait options accepted by every endpoint that changes the
        page. Once the action runs the daemon polls
        `document.querySelector(waitFor)` on a 100 ms tick until it returns a
        non-null node or `timeoutMs` elapses (default 10000).

        `preDelayMs` and `postDelayMs` are pure time-based sleeps applied
        before the action starts / after a successful action returns. Use
        these for the "sleep then act" pattern; prefer `waitFor` for
        SPA-driven DOM updates. Both are capped by the daemon command
        timeout (default 30s).
      properties:
        waitFor:
          type: string
          description: CSS selector to wait for after the action returns.
        timeoutMs:
          type: integer
          minimum: 0
          description: Cap for waitFor in milliseconds (default 10000).
        preDelayMs:
          type: integer
          minimum: 0
          description: Sleep for this many milliseconds before the action runs.
        postDelayMs:
          type: integer
          minimum: 0
          description: Sleep for this many milliseconds after a successful action.

    ViewportBody:
      type: object
      description: Viewport/device emulation fields for responsive testing.
      properties:
        viewport:
          $ref: "#/components/schemas/ViewportOptions"
        preset:
          type: string
          enum: [mobile, tablet, desktop]
          description: Named viewport profile. `mobile` is 390x844 @3x with mobile/touch enabled.
        width:
          type: integer
          minimum: 1
          description: Viewport width in CSS pixels.
        height:
          type: integer
          minimum: 1
          description: Viewport height in CSS pixels.
        dpr:
          type: number
          exclusiveMinimum: 0
          description: Device scale factor.
        mobile:
          type: boolean
          description: Enable mobile device metrics.
        touch:
          type: boolean
          description: Enable touch emulation.
        reset:
          type: boolean
          description: Clear CDP viewport and touch emulation.

    ViewportOptions:
      type: object
      properties:
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        dpr: { type: number }
        mobile: { type: boolean }
        touch: { type: boolean }
        reset: { type: boolean }

    Since:
      description: |
        Filter events newer than this point. Accepts:
        - an integer sequence number,
        - a numeric string,
        - or the sentinel `"last_action"` meaning "since the last user action".
      oneOf:
        - type: integer
        - type: string

    Request:
      type: object
      description: Full `protocol.Request` envelope for `/command`.
      required: [action]
      properties:
        id: { type: string }
        action: { type: string }
      additionalProperties: true

    Response:
      type: object
      description: Standard response envelope.
      properties:
        id: { type: string }
        success: { type: boolean }
        error: { type: string }
        data: { type: object, additionalProperties: true }

    DoctorCheck:
      type: object
      properties:
        name: { type: string }
        status:
          type: string
          enum: [ok, warn, fail]
        detail: { type: string }

    DoctorReport:
      type: object
      properties:
        ok:
          type: boolean
          description: True when no check has status `fail`. Warnings do not flip this.
        checks:
          type: array
          items: { $ref: "#/components/schemas/DoctorCheck" }

    DaemonStatus:
      type: object
      properties:
        running: { type: boolean }
        cdpConnected: { type: boolean }
        cdpHost: { type: string, description: CDP host configured for this daemon }
        cdpPort: { type: integer, description: CDP port configured for this daemon }
        uptime: { type: integer }
        currentSeq: { type: integer }
        currentTargetId: { type: string }
        idleTabCloseMinutes: { type: integer, description: Effective idle-tab timeout in minutes; 0 disables }
        maxTabs: { type: integer, description: Effective page-tab cap; 0 means unlimited }
        tabs:
          type: array
          items:
            type: object
            properties:
              shortId: { type: string }
              targetId: { type: string }
              networkRequests: { type: integer }
              consoleMessages: { type: integer }
              jsErrors: { type: integer }
              lastActionSeq: { type: integer }

    TabInfo:
      type: object
      properties:
        index: { type: integer }
        url: { type: string }
        title: { type: string }
        active: { type: boolean }
        tabId: { $ref: "#/components/schemas/TabID" }
        tab: { type: string }

    RefInfo:
      type: object
      properties:
        backendDOMNodeId: { type: integer }
        xpath: { type: string }
        role: { type: string }
        name: { type: string }
        tagName: { type: string }

    ElementInfo:
      type: object
      properties:
        ref: { type: string }
        backendDOMNodeId: { type: integer }
        xpath: { type: string }
        role: { type: string }
        name: { type: string }
        tagName: { type: string }

    SnapshotData:
      type: object
      properties:
        snapshot:
          type: string
          description: Human-readable accessibility tree snapshot.
        refs:
          type: object
          additionalProperties: { $ref: "#/components/schemas/RefInfo" }
        elements:
          type: array
          items: { $ref: "#/components/schemas/ElementInfo" }

    AttrDelta:
      type: object
      properties:
        old: { type: string }
        new: { type: string }

    DiffEntry:
      type: object
      properties:
        ref:
          type: string
          description: |
            For added/changed entries, the CURRENT snapshot's ref (safe to
            act on). For removed entries, the PREVIOUS ref (informational —
            the node is gone).
        role: { type: string }
        name: { type: string }
        tagName: { type: string }
        xpath: { type: string }
        key:
          type: string
          description: Stable cross-snapshot identity key (id:..., sem:..., or xpath:...).

    DiffChange:
      type: object
      properties:
        ref:      { type: string, description: Current ref (safe to act on) }
        prevRef:  { type: string, description: Ref this node had in the previous snapshot }
        role:     { type: string }
        name:     { type: string }
        tagName:  { type: string }
        xpath:    { type: string }
        key:      { type: string }
        nameChanged: { $ref: "#/components/schemas/AttrDelta" }
        attrChanges:
          type: object
          additionalProperties: { $ref: "#/components/schemas/AttrDelta" }
          description: |
            Old/new pairs for each tracked attribute that changed between
            snapshots. Tracked attributes: aria-pressed, aria-checked,
            aria-expanded, aria-selected, aria-disabled, disabled,
            aria-hidden, value, checked, aria-current, aria-busy,
            aria-invalid.

    DiffStats:
      type: object
      properties:
        added:     { type: integer }
        removed:   { type: integer }
        changed:   { type: integer }
        unchanged: { type: integer }

    SnapshotDiffData:
      type: object
      description: |
        Structured diff of the current snapshot against the tab's previous
        baseline. `diff` is the rendered text (`+` added / `-` removed / `~`
        changed); the slices contain the same data programmatically.
      properties:
        diff:    { type: string }
        added:   { type: array, items: { $ref: "#/components/schemas/DiffEntry" } }
        removed: { type: array, items: { $ref: "#/components/schemas/DiffEntry" } }
        changed: { type: array, items: { $ref: "#/components/schemas/DiffChange" } }
        stats:   { $ref: "#/components/schemas/DiffStats" }
        baselineReset:
          type: boolean
          description: |
            True on the first snapshot ever, or when the URL changed since
            the previous snapshot. In that case `added` lists everything.

    NetworkRequestInfo:
      type: object
      properties:
        requestId: { type: string }
        url: { type: string }
        method: { type: string }
        type: { type: string }
        timestamp: { type: integer, format: int64 }
        status: { type: integer }
        statusText: { type: string }
        fromDiskCache: { type: boolean }
        failed: { type: boolean }
        failureReason: { type: string }
        requestHeaders:
          type: object
          additionalProperties: { type: string }
        requestBody: { type: string }
        requestBodyTruncated: { type: boolean }
        responseHeaders:
          type: object
          additionalProperties: { type: string }
        responseBody: { type: string }
        responseBodyBase64: { type: boolean }
        responseBodyTruncated: { type: boolean }
        mimeType: { type: string }
        bodyError: { type: string }
        seq: { type: integer }

    ConsoleMessageInfo:
      type: object
      properties:
        type: { type: string }
        text: { type: string }
        timestamp: { type: integer, format: int64 }
        url: { type: string }
        lineNumber: { type: integer }
        seq: { type: integer }

    JSErrorInfo:
      type: object
      properties:
        message: { type: string }
        url: { type: string }
        lineNumber: { type: integer }
        columnNumber: { type: integer }
        stackTrace: { type: string }
        timestamp: { type: integer, format: int64 }
        seq: { type: integer }

    SiteArgDef:
      type: object
      properties:
        required: { type: boolean }
        description: { type: string }
        default: { type: string }

    SiteMeta:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        domain: { type: string }
        startUrl: { type: string }
        readOnly: { type: boolean }
        example: { type: string }
        argOrder:
          type: array
          items: { type: string }
        entry: { type: string }
        timeoutMs: { type: integer }
        output: { type: object, additionalProperties: true }
        source: { type: string }
        sourceRepo: { type: string }
        sha256: { type: string }
        trusted: { type: boolean }
        usageCount: { type: integer }
        lastUsed: { type: string }
        args:
          type: object
          additionalProperties: { $ref: "#/components/schemas/SiteArgDef" }
