  /v1/windows:
    get:
      tags: [extension]
      summary: List Chrome browser windows
      responses:
        "200": { description: Window list }
        "503": { $ref: "#/components/responses/Error" }

  /v1/windows/create:
    post:
      tags: [extension]
      summary: Create a Chrome browser window
      requestBody: { $ref: "#/components/requestBodies/FreeformJSON" }
